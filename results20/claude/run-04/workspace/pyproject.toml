[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memo"
version = "0.1.0"
description = "A tiny, zero-dependency, tagged journal stored as JSON."
requires-python = ">=3.9"

[project.scripts]
memo = "memo.__main__:main"

[tool.setuptools]
packages = ["memo"]
