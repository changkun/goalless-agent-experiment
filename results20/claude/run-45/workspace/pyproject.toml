[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "life"
version = "0.1.0"
description = "Terminal Conway's Game of Life"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
life = "game_of_life.cli:main"

[tool.setuptools]
packages = ["game_of_life"]
