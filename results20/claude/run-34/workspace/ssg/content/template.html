<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link rel="stylesheet" href="{{ css }}">
<link rel="alternate" type="application/atom+xml" href="{{ base_url }}/rss.xml" title="{{ site_title }}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ base_url }}/">{{ site_title }}</a>
  <nav><a href="{{ base_url }}/">Home</a> <a href="{{ base_url }}/about/">About</a></nav>
</header>
<main>
{{ body }}
</main>
<footer>
  <div>© {{ year }} {{ site_author }}</div>
  <form class="search" onsubmit="return false" role="search" aria-label="Search">
    <input id="search-query" type="search" placeholder="Search posts…" autocomplete="off">
    <div id="search-results"></div>
  </form>
</footer>
<script src="/search.js"></script>
</body>
</html>
