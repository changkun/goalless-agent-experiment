[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-minesweeper"
version = "1.0.0"
description = "A small dependency-free Minesweeper game for the terminal."
requires-python = ">=3.8"

[project.scripts]
minesweeper = "minesweeper.cli:main"

[tool.setuptools.packages.find]
include = ["minesweeper*"]
