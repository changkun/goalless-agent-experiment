[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "passgen"
version = "0.1.0"
description = "A tiny dependency-free passphrase and password generator with entropy math"
requires-python = ">=3.9"

[project.scripts]
passgen = "passgen:main"

[tool.setuptools]
packages = ["passgen"]
