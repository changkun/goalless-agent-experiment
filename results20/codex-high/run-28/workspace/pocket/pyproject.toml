[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket"
version = "0.1.0"
description = "A zero-dependency notes and tasks manager stored in Markdown."
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
pocket = "pocket.cli:main"

[tool.setuptools.packages.find]
where = ["."]
