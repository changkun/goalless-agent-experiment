[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "streaks"
version = "0.1.0"
description = "A minimal local habit streak tracker CLI."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
streaks = "streaks.cli:main"

[tool.setuptools.packages.find]
include = ["streaks*"]
