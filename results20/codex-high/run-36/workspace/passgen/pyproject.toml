[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "passgen"
version = "0.1.0"
description = "Dependency-free password generator and strength analyzer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["password", "security", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
passgen = "passgen.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["passgen"]
