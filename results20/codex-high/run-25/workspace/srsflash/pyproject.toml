[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "srsflash"
version = "0.1.0"
description = "Spaced-repetition flashcards CLI using the SM-2 algorithm"
requires-python = ">=3.10"

[project.scripts]
srsflash = "srsflash.cli:main"

[tool.setuptools]
packages = ["srsflash"]
