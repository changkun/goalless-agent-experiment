[project]
name = "maze"
version = "0.1.0"
description = "A tiny dependency-free terminal maze generator and solver."
requires-python = ">=3.9"

[project.scripts]
maze = "maze.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["maze"]
