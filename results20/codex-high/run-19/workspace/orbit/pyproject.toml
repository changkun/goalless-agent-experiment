[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "0.1.0"
description = "A tiny, dependency-free ASCII solar-system explorer."
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
orbit = "orbit.cli:main"

[tool.setuptools]
packages = ["orbit"]
