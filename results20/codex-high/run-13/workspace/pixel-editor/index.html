<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Painter</title>
<style>
  :root {
    --bg: #1e1e2e;
    --panel: #27273a;
    --accent: #89b4fa;
    --text: #cdd6f4;
    --muted: #6c7086;
    --danger: #f38ba8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 { font-size: 22px; letter-spacing: 1px; margin: 0 0 16px; font-weight: 700; }
  h1 span { color: var(--accent); }
  .app { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .panel { background: var(--panel); border-radius: 14px; padding: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  .canvas-wrap { position: relative; line-height: 0; border-radius: 8px; overflow: hidden; background: repeating-conic-gradient(#2a2a3c 0% 25%, #333350 0% 50%) 0 0 / 16px 16px; }
  canvas#art { display: block; cursor: crosshair; image-rendering: pixelated; touch-action: none; }
  .gridlines canvas { position: absolute; inset: 0; pointer-events: none; }
  .tools { display: flex; flex-direction: column; gap: 14px; min-width: 180px; max-width: 220px; }
  .tools h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 4px 0 6px; }
  .icon-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tool-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 4px; background: #2f2f4a; border: 2px solid transparent;
    border-radius: 10px; color: var(--text); cursor: pointer; font-size: 11px;
    transition: border-color .15s, background .15s, transform .05s;
  }
  .tool-btn:hover { background: #3a3a5a; }
  .tool-btn.active { border-color: var(--accent); background: #3a3a5a; }
  .tool-btn:active { transform: scale(.96); }
  .tool-btn svg { width: 22px; height: 22px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row label { font-size: 12px; color: var(--muted); }
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .swatch { aspect-ratio: 1; border-radius: 7px; cursor: pointer; border: 2px solid transparent; transition: transform .1s, border-color .1s; }
  .swatch:hover { transform: scale(1.12); }
  .swatch.active { border-color: #fff; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  input[type="color"] { width: 100%; height: 34px; border: none; border-radius: 8px; background: none; cursor: pointer; padding: 0; }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 8px; }
  .btn { width: 100%; padding: 9px; border: none; border-radius: 9px; background: var(--accent); color: #1e1e2e; font-weight: 700; cursor: pointer; font-size: 13px; transition: filter .15s, transform .05s; }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: #2f2f4a; color: var(--text); }
  .btn.danger { background: var(--danger); color: #1e1e2e; }
  .hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px; }
  footer { margin-top: 20px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <h1>PIXEL <span>PAINTER</span></h1>

  <div class="app">
    <div class="canvas-wrap panel" id="wrap">
      <canvas id="art" width="320" height="320"></canvas>
      <div class="gridlines"><canvas id="grid" width="320" height="320"></canvas></div>
    </div>

    <div class="tools panel">
      <div>
        <h2>Tools</h2>
        <div class="icon-grid" id="toolbar"></div>
      </div>

      <div>
        <h2>Colors</h2>
        <div class="swatches" id="swatches"></div>
        <div class="row" style="margin-top:10px;align-items:center;">
          <span style="font-size:13px;">Custom</span>
          <input type="color" id="custom" value="#89b4fa">
        </div>
      </div>

      <div>
        <h2>Canvas</h2>
        <div class="row">
          <label for="size">Size</label>
          <input type="range" id="size" min="8" max="64" value="16" step="2">
          <span id="sizeVal" style="font-size:12px;">16</span>
        </div>
        <div class="row" style="margin-top:6px;">
          <label for="zoom">Zoom</label>
          <input type="range" id="zoom" min="2" max="24" value="10">
          <span id="zoomVal" style="font-size:12px;">10</span>
        </div>
        <div class="row" style="margin-top:8px;justify-content:space-between;">
          <label for="symmetric" style="margin:0;">Mirror X</label>
          <input type="checkbox" id="symmetric" style="accent-color:var(--accent);">
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <button class="btn" id="undo">Undo</button>
        <button class="btn" id="redo">Redo</button>
        <button class="btn ghost" id="clear">Clear</button>
        <button class="btn ghost" id="export">Export PNG</button>
      </div>

      <p class="hint">Click or drag to draw · Right-click to erase</p>
    </div>
  </div>

  <footer>Made with zero dependencies · runs entirely in your browser</footer>

  <script src="script.js"></script>
</body>
</html>
