[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "focus"
version = "1.0.0"
description = "A dependency-free CLI task tracker with a Pomodoro timer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
focus = "focus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
