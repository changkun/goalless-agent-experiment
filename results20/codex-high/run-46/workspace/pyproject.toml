[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "habits"
version = "0.1.0"
description = "A tiny zero-dependency habit tracker CLI with streaks."
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
habits = "habits.cli:main"

[tool.setuptools]
packages = ["habits"]
