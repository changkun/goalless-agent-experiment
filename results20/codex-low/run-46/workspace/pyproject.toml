[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "md2html"
version = "0.1.0"
description = "A small, dependency-free Markdown to HTML converter."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
md2html = "md2html.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["md2html*"]
