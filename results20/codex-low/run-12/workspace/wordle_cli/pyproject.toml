[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wordle-cli"
version = "0.1.0"
description = "A self-contained Wordle clone for the terminal"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
wordle = "wordle_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["wordle_cli*"]
