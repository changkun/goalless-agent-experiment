[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "game-of-life"
version = "0.1.0"
description = "A tiny, dependency-free Conway's Game of Life."
requires-python = ">=3.9"

[project.scripts]
game-of-life = "game_of_life.cli:main"

[tool.setuptools]
packages = ["game_of_life"]
