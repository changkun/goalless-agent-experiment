[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-todo"
version = "1.0.0"
description = "A tiny, dependency-free terminal task manager."
requires-python = ">=3.8"

[project.scripts]
todo = "todo_app.cli:main"

[tool.setuptools]
packages = ["todo_app"]
