[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "focus-timer"
version = "0.1.0"
description = "A tiny, dependency-free Pomodoro focus timer."
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
focus = "focus_timer.cli:main"

[tool.setuptools]
packages = ["focus_timer"]
