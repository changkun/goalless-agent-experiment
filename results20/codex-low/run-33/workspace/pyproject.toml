[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdgen"
version = "0.1.0"
description = "A tiny dependency-free Markdown-to-HTML converter."
requires-python = ">=3.9"

[project.scripts]
mdgen = "mdgen.cli:main"

[tool.setuptools.packages.find]
include = ["mdgen*"]
