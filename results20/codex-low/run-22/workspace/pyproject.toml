[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "passgen"
version = "0.1.0"
description = "Dependency-free password, token, and passphrase generator with an encrypted vault."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
passgen = "passgen.cli:main"

[tool.setuptools]
packages = ["passgen"]
