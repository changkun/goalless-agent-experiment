[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "markovgen"
version = "0.1.0"
description = "An order-N Markov chain text generator with a small CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
markovgen = "markovgen.cli:main"

[tool.setuptools]
packages = ["markovgen"]
