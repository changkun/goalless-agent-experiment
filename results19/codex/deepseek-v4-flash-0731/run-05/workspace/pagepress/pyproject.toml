[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pagepress"
version = "0.1.0"
description = "A minimal, dependency-free static site generator."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
pagepress = "pagepress.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pagepress = ["style.css"]
