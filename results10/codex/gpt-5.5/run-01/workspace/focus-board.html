<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Board</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ee;
      --ink: #1f2528;
      --muted: #657174;
      --line: #d7d1c7;
      --panel: #fffaf2;
      --accent: #176c72;
      --accent-2: #b6532f;
      --done: #4c7a3f;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.8rem);
      line-height: .92;
      letter-spacing: 0;
      max-width: 760px;
    }

    .date {
      color: var(--muted);
      font-size: .95rem;
      text-align: right;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr);
      gap: 20px;
      margin-top: 20px;
    }

    section {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 18px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: .9rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
    }

    .timer {
      display: grid;
      gap: 16px;
    }

    .time {
      font-variant-numeric: tabular-nums;
      font-size: clamp(4rem, 17vw, 10rem);
      line-height: .85;
    }

    .controls, .presets, form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #fff;
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
    }

    button.secondary {
      background: transparent;
      color: var(--ink);
    }

    button.warn {
      border-color: var(--accent-2);
      color: var(--accent-2);
    }

    .presets button {
      border-color: var(--accent);
      background: transparent;
      color: var(--accent);
      padding: 7px 10px;
    }

    input, textarea {
      min-width: 0;
      border: 1px solid var(--line);
      background: #fffdf8;
      color: var(--ink);
      border-radius: 6px;
      padding: 11px 12px;
      outline-color: var(--accent);
    }

    form input {
      flex: 1 1 240px;
    }

    .tasks {
      display: grid;
      gap: 10px;
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
    }

    .task {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fffdf8;
    }

    .task input {
      width: 18px;
      height: 18px;
    }

    .task.done span {
      color: var(--muted);
      text-decoration: line-through;
    }

    .task button {
      width: 34px;
      height: 34px;
      padding: 0;
      border-color: transparent;
      background: transparent;
      color: var(--muted);
      font-size: 1.25rem;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      line-height: 1.5;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      background: #fffdf8;
    }

    .stat strong {
      display: block;
      font-size: 1.6rem;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .stat span {
      color: var(--muted);
      font-size: .84rem;
    }

    @media (max-width: 760px) {
      main {
        width: min(100% - 24px, 1120px);
        padding: 18px 0;
      }

      header, .layout {
        grid-template-columns: 1fr;
      }

      .date {
        text-align: left;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Focus Board</h1>
      <div class="date" id="date"></div>
    </header>

    <div class="layout">
      <div>
        <section class="timer" aria-labelledby="timer-heading">
          <h2 id="timer-heading">Timer</h2>
          <div class="time" id="time">25:00</div>
          <div class="controls">
            <button id="toggle">Start</button>
            <button class="secondary" id="reset">Reset</button>
            <button class="secondary warn" id="clear">Clear Data</button>
          </div>
          <div class="presets" aria-label="Timer presets">
            <button data-minutes="5">5 min</button>
            <button data-minutes="15">15 min</button>
            <button data-minutes="25">25 min</button>
            <button data-minutes="50">50 min</button>
          </div>
          <div class="stats" aria-label="Daily stats">
            <div class="stat"><strong id="sessions">0</strong><span>sessions</span></div>
            <div class="stat"><strong id="completed">0</strong><span>done</span></div>
            <div class="stat"><strong id="minutes">0</strong><span>focus min</span></div>
          </div>
        </section>

        <section style="margin-top:20px" aria-labelledby="tasks-heading">
          <h2 id="tasks-heading">Tasks</h2>
          <form id="task-form">
            <input id="task-input" autocomplete="off" placeholder="Add a task">
            <button>Add</button>
          </form>
          <ul class="tasks" id="tasks"></ul>
        </section>
      </div>

      <section aria-labelledby="notes-heading">
        <h2 id="notes-heading">Notes</h2>
        <textarea id="notes" placeholder="Keep the scratchpad messy."></textarea>
      </section>
    </div>
  </main>

  <script>
    const todayKey = new Date().toISOString().slice(0, 10);
    const storageKey = `focus-board:${todayKey}`;
    const defaults = { tasks: [], notes: "", sessions: 0, minutes: 0 };
    const state = JSON.parse(localStorage.getItem(storageKey) || JSON.stringify(defaults));

    let duration = 25 * 60;
    let remaining = duration;
    let timer = null;

    const date = document.querySelector("#date");
    const time = document.querySelector("#time");
    const toggle = document.querySelector("#toggle");
    const reset = document.querySelector("#reset");
    const clear = document.querySelector("#clear");
    const tasks = document.querySelector("#tasks");
    const taskForm = document.querySelector("#task-form");
    const taskInput = document.querySelector("#task-input");
    const notes = document.querySelector("#notes");
    const sessions = document.querySelector("#sessions");
    const completed = document.querySelector("#completed");
    const minutes = document.querySelector("#minutes");

    date.textContent = new Intl.DateTimeFormat(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric"
    }).format(new Date());

    function save() {
      localStorage.setItem(storageKey, JSON.stringify(state));
    }

    function renderTimer() {
      const mins = String(Math.floor(remaining / 60)).padStart(2, "0");
      const secs = String(remaining % 60).padStart(2, "0");
      time.textContent = `${mins}:${secs}`;
    }

    function renderStats() {
      sessions.textContent = state.sessions;
      completed.textContent = state.tasks.filter((task) => task.done).length;
      minutes.textContent = state.minutes;
    }

    function renderTasks() {
      tasks.innerHTML = "";
      state.tasks.forEach((task) => {
        const item = document.createElement("li");
        item.className = `task${task.done ? " done" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          save();
          render();
        });

        const label = document.createElement("span");
        label.textContent = task.text;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.setAttribute("aria-label", `Remove ${task.text}`);
        remove.textContent = "x";
        remove.addEventListener("click", () => {
          state.tasks = state.tasks.filter((entry) => entry.id !== task.id);
          save();
          render();
        });

        item.append(checkbox, label, remove);
        tasks.append(item);
      });
    }

    function render() {
      notes.value = state.notes;
      renderTimer();
      renderTasks();
      renderStats();
    }

    function stopTimer() {
      window.clearInterval(timer);
      timer = null;
      toggle.textContent = "Start";
    }

    function completeSession() {
      stopTimer();
      state.sessions += 1;
      state.minutes += Math.round(duration / 60);
      remaining = duration;
      save();
      render();
    }

    toggle.addEventListener("click", () => {
      if (timer) {
        stopTimer();
        return;
      }

      toggle.textContent = "Pause";
      timer = window.setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          completeSession();
          return;
        }
        renderTimer();
      }, 1000);
    });

    reset.addEventListener("click", () => {
      stopTimer();
      remaining = duration;
      renderTimer();
    });

    clear.addEventListener("click", () => {
      if (!confirm("Clear today's board?")) return;
      Object.assign(state, JSON.parse(JSON.stringify(defaults)));
      stopTimer();
      remaining = duration;
      save();
      render();
    });

    document.querySelectorAll("[data-minutes]").forEach((button) => {
      button.addEventListener("click", () => {
        duration = Number(button.dataset.minutes) * 60;
        remaining = duration;
        stopTimer();
        renderTimer();
      });
    });

    taskForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;
      state.tasks.push({ id: crypto.randomUUID(), text, done: false });
      taskInput.value = "";
      save();
      render();
    });

    notes.addEventListener("input", () => {
      state.notes = notes.value;
      save();
    });

    render();
  </script>
</body>
</html>
