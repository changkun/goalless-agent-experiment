<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Procedural starfield with aurora">
  <title>Procedural starfield with aurora</title>

  <defs>
    <!-- Sky gradient: deep night to faint horizon glow -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#04060f"/>
      <stop offset="55%" stop-color="#0a1130"/>
      <stop offset="100%" stop-color="#1a2a55"/>
    </linearGradient>

    <!-- Aurora ribbon gradient: green to violet, partially transparent -->
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ff9d" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#00ff9d" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff5ce0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5cffb0" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#5cffb0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3a7bff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft glow for stars -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Distant mountain silhouette -->
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#02030a"/>
    </linearGradient>

    <!-- Filter to soften aurora edges -->
    <filter id="blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blurMore" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <!-- A single star symbol used by <use> -->
    <symbol id="star" overflow="visible">
      <circle r="1.2" fill="#ffffff"/>
      <circle r="3" fill="url(#glow)"/>
    </symbol>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- A handful of brighter "named" stars with tiny twinkle crosses -->
  <g fill="#ffffff" opacity="0.9">
    <g transform="translate(120,80)">
      <circle r="1.6"/>
      <path d="M-5,0 L5,0 M0,-5 L0,5" stroke="#ffffff" stroke-width="0.4" opacity="0.6"/>
    </g>
    <g transform="translate(640,60)">
      <circle r="1.8"/>
      <path d="M-6,0 L6,0 M0,-6 L0,6" stroke="#ffffff" stroke-width="0.4" opacity="0.6"/>
    </g>
    <g transform="translate(720,150)">
      <circle r="1.4"/>
    </g>
    <g transform="translate(70,200)">
      <circle r="1.3"/>
    </g>
    <g transform="translate(300,40)">
      <circle r="1.1"/>
    </g>
    <g transform="translate(540,120)">
      <circle r="1.2"/>
    </g>
  </g>

  <!-- Many small dim stars, scattered -->
  <g opacity="0.85">
    <use href="#star" x="20"  y="30"/>
    <use href="#star" x="55"  y="95"/>
    <use href="#star" x="90"  y="55"/>
    <use href="#star" x="150" y="30"/>
    <use href="#star" x="180" y="140"/>
    <use href="#star" x="210" y="70"/>
    <use href="#star" x="250" y="20"/>
    <use href="#star" x="285" y="110"/>
    <use href="#star" x="330" y="60"/>
    <use href="#star" x="365" y="25"/>
    <use href="#star" x="400" y="95"/>
    <use href="#star" x="430" y="45"/>
    <use href="#star" x="470" y="80"/>
    <use href="#star" x="500" y="30"/>
    <use href="#star" x="560" y="55"/>
    <use href="#star" x="600" y="100"/>
    <use href="#star" x="660" y="35"/>
    <use href="#star" x="690" y="80"/>
    <use href="#star" x="750" y="55"/>
    <use href="#star" x="780" y="120"/>
    <use href="#star" x="35"  y="160"/>
    <use href="#star" x="105" y="180"/>
    <use href="#star" x="170" y="200"/>
    <use href="#star" x="230" y="170"/>
    <use href="#star" x="310" y="195"/>
    <use href="#star" x="380" y="170"/>
    <use href="#star" x="450" y="190"/>
    <use href="#star" x="520" y="175"/>
    <use href="#star" x="590" y="200"/>
    <use href="#star" x="670" y="185"/>
    <use href="#star" x="740" y="190"/>
  </g>

  <!-- Aurora ribbons: thick blurred strokes following sine-ish paths -->
  <g filter="url(#blurMore)" opacity="0.9">
    <path d="M-20,260 C 120,180 240,340 380,240 S 660,180 820,260 L 820,360 C 660,300 520,420 380,360 S 120,300 -20,380 Z"
          fill="url(#aurora1)"/>
  </g>
  <g filter="url(#blur)" opacity="0.85">
    <path d="M-20,220 C 140,140 260,300 420,220 S 700,160 820,230"
          fill="none" stroke="url(#aurora2)" stroke-width="34" stroke-linecap="round"/>
    <path d="M-20,300 C 160,240 280,360 440,290 S 700,250 820,310"
          fill="none" stroke="url(#aurora1)" stroke-width="22" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Distant mountain range, two layers for depth -->
  <path d="M0,420 L 60,380 L 120,405 L 180,360 L 240,395 L 300,370 L 360,400 L 420,365 L 480,395 L 540,375 L 600,405 L 660,380 L 720,400 L 800,385 L 800,500 L 0,500 Z"
        fill="url(#mtn)" opacity="0.85"/>
  <path d="M0,460 L 50,440 L 110,455 L 170,430 L 230,455 L 290,435 L 350,460 L 410,440 L 470,460 L 530,445 L 590,460 L 650,440 L 710,458 L 770,445 L 800,455 L 800,500 L 0,500 Z"
        fill="#01030a"/>

  <!-- A small lone tree on the horizon for scale -->
  <g transform="translate(180,438)" fill="#01030a">
    <rect x="-1" y="0" width="2" height="14"/>
    <polygon points="-10,0 10,0 0,-22"/>
  </g>
  <g transform="translate(560,448)" fill="#01030a">
    <rect x="-1" y="0" width="2" height="10"/>
    <polygon points="-7,0 7,0 0,-16"/>
  </g>

  <!-- Faint ground reflection of the aurora -->
  <rect x="0" y="470" width="800" height="30" fill="#7c5cff" opacity="0.05"/>
</svg>
