<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON ASTEROIDS</title>
<style>
  :root {
    --cyan: #4df3ff;
    --magenta: #ff4dd8;
    --amber: #ffb347;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #0b0d1f 0%, #05060e 70%);
    font-family: "Courier New", monospace;
    color: var(--cyan);
  }
  #game {
    position: absolute;
    inset: 0;
    display: block;
  }
  .hud {
    position: absolute;
    top: 16px;
    font-size: 18px;
    letter-spacing: 3px;
    text-shadow: 0 0 8px var(--cyan);
    user-select: none;
    pointer-events: none;
  }
  #score { left: 20px; }
  #lives { right: 20px; color: var(--magenta); text-shadow: 0 0 8px var(--magenta); }
  #wave {
    left: 50%;
    transform: translateX(-50%);
    color: var(--amber);
    text-shadow: 0 0 8px var(--amber);
    opacity: 0.85;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(5, 6, 14, 0.55);
    text-align: center;
    transition: opacity 0.4s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 {
    font-size: clamp(32px, 7vw, 72px);
    letter-spacing: 12px;
    color: #fff;
    text-shadow:
      0 0 10px var(--cyan),
      0 0 30px var(--cyan),
      0 0 60px var(--magenta);
    animation: pulse 2.2s ease-in-out infinite;
  }
  #overlay p {
    font-size: 15px;
    letter-spacing: 4px;
    color: #9adcff;
    text-shadow: 0 0 6px var(--cyan);
    line-height: 2;
  }
  #overlay .blink {
    margin-top: 10px;
    font-size: 18px;
    letter-spacing: 6px;
    color: #fff;
    animation: blink 1.1s steps(2) infinite;
  }
  @keyframes pulse {
    0%, 100% { text-shadow: 0 0 10px var(--cyan), 0 0 30px var(--cyan), 0 0 60px var(--magenta); }
    50% { text-shadow: 0 0 20px var(--magenta), 0 0 50px var(--magenta), 0 0 90px var(--cyan); }
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="score">SCORE 0</div>
  <div class="hud" id="lives">&#10084;&#10084;&#10084;</div>
  <div class="hud" id="wave">WAVE 1</div>
  <div id="overlay">
    <h1>NEON ASTEROIDS</h1>
    <p>
      THRUST &uarr; / W &nbsp;&middot;&nbsp; TURN &larr; &rarr; / A D<br>
      FIRE SPACE &nbsp;&middot;&nbsp; HYPERSPACE SHIFT &nbsp;&middot;&nbsp; PAUSE P
    </p>
    <div class="blink">PRESS ENTER TO LAUNCH</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
