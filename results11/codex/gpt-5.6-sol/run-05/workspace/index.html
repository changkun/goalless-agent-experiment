<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Small Sky</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.88);
      background: #07111f;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    main { position: relative; text-align: center; padding: 2rem; user-select: none; }
    #orb {
      width: min(36vw, 260px);
      aspect-ratio: 1;
      margin: auto;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff 0 2%, #8ce7ff 18%, #655be7 60%, #101937 100%);
      box-shadow: 0 0 70px #6171e888, 0 0 180px #2c95b744;
      animation: breathe 8s ease-in-out infinite;
    }
    #word { margin-top: 3rem; letter-spacing: .3em; font-size: .8rem; opacity: .7; }
    #note { margin-top: .8rem; font: 400 .72rem system-ui, sans-serif; opacity: .38; }
    @keyframes breathe {
      0%, 100% { transform: scale(.74); filter: saturate(.85); }
      50% { transform: scale(1); filter: saturate(1.2); }
    }
    @media (prefers-reduced-motion: reduce) { #orb { animation: none; } }
  </style>
</head>
<body>
  <canvas aria-hidden="true"></canvas>
  <main>
    <div id="orb" aria-hidden="true"></div>
    <div id="word">BREATHE IN</div>
    <div id="note">stay for one cycle · click for a new sky</div>
  </main>
  <script>
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const word = document.querySelector('#word');
    let stars = [];

    function newSky() {
      const dpr = Math.min(devicePixelRatio, 2);
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      stars = Array.from({ length: Math.floor(innerWidth * innerHeight / 5500) }, () => ({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: Math.random() * 1.3 + .2,
        a: Math.random() * .65 + .15
      }));
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const s of stars) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(210,235,255,${s.a})`;
        ctx.fill();
      }
    }

    let last = '';
    function guide(now) {
      const phase = now % 8000;
      const next = phase < 4000 ? 'BREATHE IN' : 'BREATHE OUT';
      if (next !== last) word.animate([{ opacity: 0 }, { opacity: .7 }], { duration: 700 });
      word.textContent = last = next;
      requestAnimationFrame(guide);
    }

    addEventListener('resize', newSky);
    addEventListener('click', newSky);
    newSky();
    requestAnimationFrame(guide);
  </script>
</body>
</html>
