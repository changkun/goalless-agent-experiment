<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b1c">
  <title>A Small Good Thing</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f1ff;
      --muted: #aaa8c7;
      --line: rgba(255, 255, 255, .14);
      --glow: #ffd78a;
      --violet: #8e7cff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090b1c;
    }

    .sky {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 100svh;
      isolation: isolate;
      background:
        radial-gradient(circle at 70% 25%, rgba(105, 88, 191, .28), transparent 30rem),
        radial-gradient(circle at 15% 90%, rgba(63, 90, 165, .25), transparent 28rem),
        linear-gradient(145deg, #090b1c 0%, #11142f 55%, #171a3b 100%);
    }

    .sky::before,
    .sky::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.5) 0 1px, transparent 1.5px);
      background-size: 137px 151px, 211px 197px;
      background-position: 22px 31px, 91px 117px;
      opacity: .34;
    }

    .sky::after { transform: scale(1.5); opacity: .12; }

    .moon {
      position: absolute;
      top: 12vh;
      right: 13vw;
      width: clamp(5rem, 13vw, 9rem);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #fff4d3;
      box-shadow: 0 0 3rem rgba(255, 223, 151, .3), 0 0 10rem rgba(156, 137, 255, .15);
    }

    .moon::after {
      content: "";
      position: absolute;
      inset: -1px 0 0 -8px;
      border-radius: 50%;
      background: #171a3b;
    }

    .card {
      width: min(90vw, 34rem);
      padding: clamp(2rem, 7vw, 4rem);
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 1.5rem;
      background: rgba(9, 11, 28, .46);
      box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, .18);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 .8rem;
      color: var(--glow);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font: 400 clamp(2.1rem, 8vw, 3.5rem)/1.05 Georgia, serif;
      letter-spacing: -.04em;
    }

    .prompt {
      min-height: 3.2em;
      margin: 1.5rem 0 2rem;
      color: var(--muted);
      font-size: 1.02rem;
    }

    button {
      padding: .75rem 1.1rem;
      border: 1px solid rgba(255, 215, 138, .48);
      border-radius: 999px;
      color: #171321;
      font: inherit;
      font-weight: 700;
      background: var(--glow);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    button:hover, button:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 .5rem 1.5rem rgba(255, 215, 138, .2);
    }

    button:focus-visible { outline: 2px solid white; outline-offset: 4px; }

    .count {
      margin: 1.2rem 0 0;
      color: var(--muted);
      font-size: .82rem;
    }

    .star {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--glow);
      box-shadow: 0 0 7px 2px rgba(255, 215, 138, .75);
      animation: appear .5s ease-out both, twinkle 3s ease-in-out 1s infinite;
      pointer-events: none;
    }

    @keyframes appear { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes twinkle { 50% { opacity: .35; transform: scale(.65); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="sky" id="sky" aria-label="A small interactive night sky">
    <div class="moon" aria-hidden="true"></div>
    <section class="card" aria-labelledby="title">
      <p class="eyebrow">A tiny observatory</p>
      <h1 id="title">A Small Good Thing</h1>
      <p class="prompt" id="prompt">Click anywhere in the sky to leave a little light behind.</p>
      <button id="newPrompt" type="button">Give me a thought</button>
      <p class="count" id="count" aria-live="polite">0 stars gathered</p>
    </section>
  </main>

  <script>
    const sky = document.querySelector('#sky');
    const prompt = document.querySelector('#prompt');
    const count = document.querySelector('#count');
    const prompts = [
      'Make one small thing easier for your future self.',
      'Notice the nearest beautiful or ordinary thing.',
      'You are allowed to begin before you feel ready.',
      'Put something unfinished down for ten quiet minutes.',
      'Send a kind thought in someone’s direction.',
      'The next step can be smaller than you think.'
    ];
    let stars = 0;

    sky.addEventListener('click', (event) => {
      if (event.target.closest('button')) return;
      const star = document.createElement('i');
      star.className = 'star';
      star.style.left = `${event.clientX - 3}px`;
      star.style.top = `${event.clientY - 3}px`;
      star.setAttribute('aria-hidden', 'true');
      sky.append(star);
      stars += 1;
      count.textContent = `${stars} star${stars === 1 ? '' : 's'} gathered`;
    });

    document.querySelector('#newPrompt').addEventListener('click', () => {
      const next = prompts[Math.floor(Math.random() * prompts.length)];
      prompt.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 350, easing: 'ease-out' });
      prompt.textContent = next;
    });
  </script>
</body>
</html>
