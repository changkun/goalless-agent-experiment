<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10221f">
  <title>Pause — a tiny reset</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f2f0e8;
      --muted: #aab8ae;
      --bg: #10221f;
      --panel: rgba(255, 255, 255, .075);
      --line: rgba(255, 255, 255, .14);
      --mint: #a9e5c5;
      --peach: #ffb98d;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(169, 229, 197, .13), transparent 32rem),
        radial-gradient(circle at 90% 85%, rgba(255, 185, 141, .10), transparent 28rem),
        var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main { width: min(92vw, 880px); padding: 3rem 0; }
    .topline { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4rem; }
    .mark { display: flex; align-items: center; gap: .65rem; font-size: .86rem; letter-spacing: .11em; text-transform: uppercase; color: var(--muted); }
    .mark i { width: .65rem; height: .65rem; display: block; border-radius: 50%; background: var(--mint); box-shadow: 0 0 1.2rem var(--mint); }
    time { color: var(--muted); font-size: .88rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(2rem, 7vw, 6.5rem); align-items: center; }
    h1 { margin: 0 0 1.25rem; max-width: 10ch; font: 500 clamp(3.5rem, 9vw, 7rem)/.9 Georgia, serif; letter-spacing: -.07em; }
    .intro { max-width: 30rem; color: var(--muted); font-size: 1.1rem; line-height: 1.65; }
    .prompt { min-height: 4.5rem; margin: 2.5rem 0; padding-left: 1.25rem; border-left: 1px solid var(--peach); color: #e6d8cc; font: italic 1.1rem/1.55 Georgia, serif; }
    .button-row { display: flex; gap: .75rem; flex-wrap: wrap; }
    button { border: 1px solid var(--line); border-radius: 999px; padding: .8rem 1.1rem; color: var(--ink); background: transparent; font: inherit; cursor: pointer; transition: transform .2s, background .2s, border-color .2s; }
    button:hover, button:focus-visible { transform: translateY(-2px); border-color: var(--mint); background: rgba(169, 229, 197, .1); outline: none; }
    button.primary { border: 0; color: #10221f; background: var(--mint); font-weight: 650; }
    button.primary:hover, button.primary:focus-visible { background: #c8f1d9; }

    .breather { min-height: 26rem; display: grid; place-items: center; position: relative; }
    .ring, .orb { position: absolute; border-radius: 50%; }
    .ring { width: min(68vw, 23rem); aspect-ratio: 1; border: 1px solid rgba(169, 229, 197, .3); box-shadow: inset 0 0 4rem rgba(169, 229, 197, .06), 0 0 5rem rgba(169, 229, 197, .06); }
    .orb { width: 9rem; aspect-ratio: 1; background: radial-gradient(circle at 34% 27%, #f2fff6, var(--mint) 18%, #6bbf9a 70%, #387b68); box-shadow: 0 0 4rem rgba(169, 229, 197, .33); transform: scale(1); transition: transform 4s cubic-bezier(.45, .05, .55, .95); }
    .breather.active .orb { transform: scale(1.7); }
    .breather.active .ring { animation: pulse 8s ease-in-out infinite; }
    .breath-label { z-index: 1; color: #10221f; font-weight: 700; text-align: center; }
    .breath-label small { display: block; margin-top: .25rem; opacity: .7; font-weight: 500; }
    .status { position: absolute; bottom: .5rem; color: var(--muted); font-size: .85rem; }
    footer { margin-top: 4rem; color: rgba(242, 240, 232, .42); font-size: .78rem; }
    @keyframes pulse { 0%, 100% { transform: scale(.94); opacity: .6; } 50% { transform: scale(1.08); opacity: 1; } }
    @media (max-width: 650px) { main { padding: 1.5rem 0 2rem; } .topline { margin-bottom: 3rem; } .grid { grid-template-columns: 1fr; gap: 1rem; } .breather { min-height: 22rem; order: -1; } .ring { width: min(82vw, 20rem); } footer { margin-top: 2rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <div class="topline">
      <div class="mark"><i aria-hidden="true"></i> Pause</div>
      <time id="clock" aria-label="Current time"></time>
    </div>

    <section class="grid" aria-label="A tiny reset">
      <div>
        <h1>Make room for now.</h1>
        <p class="intro">A small pocket of quiet for whenever the day starts moving faster than you do.</p>
        <p class="prompt" id="prompt">What is one thing that is already okay?</p>
        <div class="button-row">
          <button class="primary" id="start" type="button">Begin breathing</button>
          <button id="new-prompt" type="button">A different thought</button>
        </div>
      </div>

      <div class="breather" id="breather" aria-live="polite">
        <div class="ring" aria-hidden="true"></div>
        <div class="orb"><div class="breath-label" id="breath-label">Ready<small>4–4 breathing</small></div></div>
        <div class="status" id="status">Four seconds in · four seconds out</div>
      </div>
    </section>
    <footer>Nothing to achieve here.</footer>
  </main>

  <script>
    const prompts = [
      'What is one thing that is already okay?',
      'What can wait until tomorrow?',
      'Notice one color you can see right now.',
      'Which part of you needs a little kindness?',
      'What would “enough” look like for today?',
      'Let one small, pleasant detail have your attention.'
    ];
    const breath = document.querySelector('#breather');
    const start = document.querySelector('#start');
    const label = document.querySelector('#breath-label');
    const status = document.querySelector('#status');
    let running = false;
    let timer;
    let promptIndex = 0;

    function updateClock() {
      document.querySelector('#clock').textContent = new Intl.DateTimeFormat([], { hour: 'numeric', minute: '2-digit' }).format(new Date());
    }
    updateClock();
    setInterval(updateClock, 30000);

    document.querySelector('#new-prompt').addEventListener('click', () => {
      promptIndex = (promptIndex + 1) % prompts.length;
      document.querySelector('#prompt').textContent = prompts[promptIndex];
    });

    function phase(name, seconds) {
      label.firstChild.textContent = name;
      status.textContent = name === 'Breathe in' ? 'Gently fill the space' : 'Let the breath leave on its own';
      timer = setTimeout(() => phase(name === 'Breathe in' ? 'Breathe out' : 'Breathe in', seconds), seconds * 1000);
    }

    start.addEventListener('click', () => {
      running = !running;
      breath.classList.toggle('active', running);
      start.textContent = running ? 'Take a pause' : 'Begin breathing';
      if (running) phase('Breathe in', 4);
      else {
        clearTimeout(timer);
        label.innerHTML = 'Ready<small>4–4 breathing</small>';
        status.textContent = 'Four seconds in · four seconds out';
      }
    });
  </script>
</body>
</html>
