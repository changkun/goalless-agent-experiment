<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ef">
  <title>Tiny Wins</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20231f;
      --muted: #72776d;
      --paper: #f8f5ef;
      --card: rgba(255, 255, 255, .72);
      --line: rgba(32, 35, 31, .12);
      --accent: #d95f42;
      --accent-dark: #99412e;
      --mint: #dce9d8;
      --shadow: 0 24px 70px rgba(73, 62, 44, .13);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 8%, #f1d9b7 0 13%, transparent 34%),
        radial-gradient(circle at 92% 86%, #d9e6d4 0 14%, transparent 36%),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 28px 18px;
    }

    main { width: min(100%, 760px); }

    .eyebrow {
      color: var(--accent-dark);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin: 0 0 16px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.1rem, 10vw, 6.8rem);
      font-weight: 400;
      letter-spacing: -.075em;
      line-height: .84;
      margin: 0;
      max-width: 680px;
    }

    .intro {
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.12rem);
      line-height: 1.55;
      margin: 24px 0 30px;
      max-width: 470px;
    }

    .panel {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, .8);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .panel-top { padding: clamp(22px, 5vw, 42px); }

    .prompt-label {
      color: var(--muted);
      font-size: .8rem;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    #prompt {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.8rem, 5vw, 3.25rem);
      letter-spacing: -.045em;
      line-height: 1.03;
      margin: 18px 0 28px;
      max-width: 620px;
    }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; }

    button {
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      min-height: 48px;
      padding: 0 20px;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid #3e7761; outline-offset: 3px; }

    .primary {
      background: var(--accent);
      color: #fffaf4;
      box-shadow: 0 8px 20px rgba(217, 95, 66, .22);
    }

    .secondary { background: rgba(32, 35, 31, .08); color: var(--ink); }
    .secondary:hover { background: rgba(32, 35, 31, .14); }

    .panel-bottom {
      align-items: center;
      background: rgba(220, 233, 216, .55);
      border-top: 1px solid var(--line);
      display: flex;
      gap: 16px;
      justify-content: space-between;
      padding: 17px clamp(22px, 5vw, 42px);
    }

    .count { color: var(--muted); font-size: .92rem; }
    .count strong { color: var(--ink); font-size: 1.15rem; }

    .check {
      align-items: center;
      background: transparent;
      color: var(--accent-dark);
      font-size: .92rem;
      min-height: 36px;
      padding: 0;
    }

    .check:hover { color: var(--ink); }

    footer {
      color: var(--muted);
      display: flex;
      font-size: .8rem;
      justify-content: space-between;
      margin-top: 18px;
      padding: 0 4px;
    }

    .spark { display: inline-block; margin-right: 5px; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .arrive { animation: arrive .35s ease both; }

    @media (max-width: 520px) {
      .panel-bottom { align-items: flex-start; flex-direction: column; gap: 8px; }
      footer { flex-direction: column; gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A pocket-sized reset</p>
    <h1>One small thing<br>is enough.</h1>
    <p class="intro">When the day feels too large, pick a tiny action. No optimization required. Just a gentle nudge back into the room.</p>

    <section class="panel" aria-labelledby="prompt-label">
      <div class="panel-top">
        <div id="prompt-label" class="prompt-label">Your next tiny win</div>
        <div id="prompt" role="status" aria-live="polite">Put your phone down and take three slow breaths.</div>
        <div class="actions">
          <button class="primary" id="done">I did it ✓</button>
          <button class="secondary" id="another">Give me another</button>
        </div>
      </div>
      <div class="panel-bottom">
        <div class="count"><strong id="score">0</strong> tiny wins today</div>
        <button class="check" id="reset" type="button">Reset today</button>
      </div>
    </section>

    <footer>
      <span><span class="spark">✦</span>Saved only on this device</span>
      <span id="date"></span>
    </footer>
  </main>

  <script>
    const prompts = [
      'Put your phone down and take three slow breaths.',
      'Drink a glass of water as if you are looking after someone you love.',
      'Open a window and notice the first thing you hear.',
      'Put one thing back where it belongs.',
      'Send a two-word message to someone you like.',
      'Stretch your shoulders up to your ears, then let them drop.',
      'Write down the one thing that would make today feel lighter.',
      'Stand in a patch of sunlight for one minute.',
      'Clear one small surface. Stop while it still feels easy.',
      'Look away from the screen and find three blue things.',
      'Make your next cup of tea or coffee a little ceremonial.',
      'Step outside—or at least put both feet on the floor.'
    ];

    const prompt = document.querySelector('#prompt');
    const score = document.querySelector('#score');
    const date = document.querySelector('#date');
    const today = new Date().toISOString().slice(0, 10);
    const saved = JSON.parse(localStorage.getItem('tiny-wins') || '{}');
    let wins = saved.date === today ? saved.wins : 0;
    let current = 0;

    function renderScore() { score.textContent = wins; }
    function showPrompt() {
      let next = Math.floor(Math.random() * prompts.length);
      while (prompts.length > 1 && next === current) next = Math.floor(Math.random() * prompts.length);
      current = next;
      prompt.classList.remove('arrive');
      void prompt.offsetWidth;
      prompt.classList.add('arrive');
      prompt.textContent = prompts[current];
    }
    function save() {
      localStorage.setItem('tiny-wins', JSON.stringify({ date: today, wins }));
    }

    document.querySelector('#another').addEventListener('click', showPrompt);
    document.querySelector('#done').addEventListener('click', () => {
      wins += 1;
      renderScore();
      save();
      showPrompt();
    });
    document.querySelector('#reset').addEventListener('click', () => {
      if (!wins || confirm('Reset your tiny wins for today?')) {
        wins = 0;
        renderScore();
        save();
      }
    });

    date.textContent = new Intl.DateTimeFormat(undefined, { dateStyle: 'long' }).format(new Date());
    renderScore();
  </script>
</body>
</html>
