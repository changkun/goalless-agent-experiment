<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>One Thing</title>
    <style>
      :root { --ink: #f7f3ea; --muted: #b9b0a1; --accent: #f2b880; --paper: #1c2029; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh; margin: 0; display: grid; place-items: center;
        background: radial-gradient(circle at 20% 15%, #35435a, transparent 40%), var(--paper);
        color: var(--ink); font: 16px/1.5 ui-rounded, "Avenir Next", system-ui, sans-serif;
      }
      main { width: min(92vw, 42rem); padding: 3rem 2rem; }
      .eyebrow { color: var(--accent); font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { max-width: 10ch; margin: .4rem 0 1rem; font-size: clamp(3rem, 10vw, 5.5rem); letter-spacing: -.07em; line-height: .92; }
      p { max-width: 42ch; color: var(--muted); }
      form { display: flex; gap: .75rem; margin-top: 2.5rem; }
      input { min-width: 0; flex: 1; border: 1px solid #596171; border-radius: .55rem; background: #151923; color: inherit; padding: .85rem 1rem; font: inherit; }
      button { border: 0; border-radius: .55rem; background: var(--accent); color: #2e2117; cursor: pointer; font: inherit; font-weight: 700; padding: .85rem 1.1rem; }
      button:hover { filter: brightness(1.08); }
      #answer { min-height: 1.5em; margin-top: 1.15rem; color: var(--ink); font-size: 1.1rem; }
      footer { margin-top: 5rem; color: #858b97; font-size: .85rem; }
      @media (max-width: 30rem) { form { flex-direction: column; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">A very small decision tool</div>
      <h1>What matters now?</h1>
      <p>Not the whole plan. Not every open loop. Just one thing worth giving your full attention for the next little while.</p>
      <form id="form">
        <input id="task" autocomplete="off" placeholder="Write the one thing…" aria-label="One thing to do" />
        <button>Choose it</button>
      </form>
      <div id="answer" aria-live="polite"></div>
      <footer>Small enough to start. Clear enough to finish.</footer>
    </main>
    <script>
      const form = document.querySelector('#form');
      const task = document.querySelector('#task');
      const answer = document.querySelector('#answer');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const value = task.value.trim();
        answer.textContent = value ? `Then do this: ${value}` : 'Name it first. One honest sentence is enough.';
      });
    </script>
  </body>
</html>
