<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Still — focus timer</title>
  <style>
    :root { color-scheme: dark; --ink: #f4efe8; --muted: #b6b0aa; --accent: #d6a46e; --surface: #1d2128; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 15%, #343244, #161a20 56%); color: var(--ink); font-family: Georgia, serif; }
    main { width: min(92vw, 34rem); padding: 3rem 1.5rem; text-align: center; }
    h1 { margin: 0; font-size: 1.1rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
    .mode { min-height: 1.5em; margin: 2.5rem 0 .35rem; color: var(--accent); font-size: 1.05rem; letter-spacing: .06em; }
    time { display: block; font: 400 clamp(5rem, 24vw, 9rem)/.9 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -.09em; }
    .progress { height: 3px; margin: 2.2rem auto; width: 82%; background: #ffffff1c; border-radius: 99px; overflow: hidden; }
    .progress > i { display: block; height: 100%; width: 100%; transform-origin: left; background: var(--accent); transition: transform .4s linear; }
    .controls { display: flex; justify-content: center; gap: .8rem; }
    button { border: 1px solid #ffffff2c; border-radius: 99px; background: #ffffff0d; padding: .75rem 1.15rem; color: var(--ink); font: 600 .8rem/1 system-ui, sans-serif; letter-spacing: .06em; cursor: pointer; }
    button:first-child { border-color: transparent; background: var(--accent); color: #20170f; }
    button:hover { filter: brightness(1.12); }
    .hint { margin-top: 2.4rem; color: var(--muted); font: .82rem/1.5 system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <h1>Still</h1>
    <div class="mode" id="mode">Focus session</div>
    <time id="clock" datetime="PT25M">25:00</time>
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <div class="controls">
      <button id="toggle" type="button">Begin</button>
      <button id="reset" type="button">Reset</button>
      <button id="skip" type="button">Skip</button>
    </div>
    <p class="hint">25 minutes of attention, then 5 minutes to breathe.</p>
  </main>
  <script>
    const phases = [{ name: 'Focus session', seconds: 25 * 60 }, { name: 'Short break', seconds: 5 * 60 }];
    let phase = 0, remaining = phases[0].seconds, running = false, tick;
    const $ = id => document.getElementById(id);
    function render() {
      const total = phases[phase].seconds, minutes = Math.floor(remaining / 60), seconds = remaining % 60;
      $('mode').textContent = phases[phase].name;
      $('clock').textContent = `${minutes}:${String(seconds).padStart(2, '0')}`;
      $('clock').dateTime = `PT${remaining}S`;
      $('bar').style.transform = `scaleX(${remaining / total})`;
      document.title = `${$('clock').textContent} — Still`;
    }
    function chime() {
      try {
        const audio = new AudioContext(), tone = audio.createOscillator(), gain = audio.createGain();
        tone.frequency.value = 660; gain.gain.setValueAtTime(.08, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + .45);
        tone.connect(gain).connect(audio.destination); tone.start(); tone.stop(audio.currentTime + .45);
      } catch {}
    }
    function advance() { phase = (phase + 1) % phases.length; remaining = phases[phase].seconds; render(); }
    function stop() { running = false; clearInterval(tick); $('toggle').textContent = 'Begin'; }
    $('toggle').onclick = () => {
      running ? stop() : (running = true, $('toggle').textContent = 'Pause', tick = setInterval(() => {
        if (remaining > 0) { remaining--; render(); }
        else { chime(); advance(); }
      }, 1000));
    };
    $('reset').onclick = () => { stop(); remaining = phases[phase].seconds; render(); };
    $('skip').onclick = () => { advance(); };
    render();
  </script>
</body>
</html>
