<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drift</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #070b14;
      color: #e8edf7;
      font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 2px 20px #000;
      transition: opacity 1.5s;
    }
    .overlay.hidden { opacity: 0; }
    h1 { margin: 0; font-size: clamp(34px, 8vw, 100px); font-weight: 300; letter-spacing: .22em; }
    p { margin: 1rem 0 0; color: #a9b4ca; letter-spacing: .08em; }
  </style>
</head>
<body>
  <canvas aria-label="Interactive field of drifting lights"></canvas>
  <div class="overlay">
    <div>
      <h1>DRIFT</h1>
      <p>move slowly · click to disturb · space to breathe</p>
    </div>
  </div>
  <script>
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.querySelector('.overlay');
    const pointer = { x: 0, y: 0, active: false };
    let particles = [];
    let paused = false;
    let width = 0;
    let height = 0;
    let dpr = 1;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      width = innerWidth;
      height = innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.min(220, Math.max(70, Math.floor(width * height / 8500)));
      particles = Array.from({ length: count }, (_, i) => particles[i] || makeParticle());
    }

    function makeParticle(x = Math.random() * width, y = Math.random() * height) {
      const hue = 190 + Math.random() * 90;
      return {
        x, y,
        vx: (Math.random() - .5) * .35,
        vy: (Math.random() - .5) * .35,
        r: .8 + Math.random() * 2.4,
        hue,
        phase: Math.random() * Math.PI * 2
      };
    }

    function disturb(x, y) {
      for (const p of particles) {
        const dx = p.x - x;
        const dy = p.y - y;
        const d = Math.hypot(dx, dy) || 1;
        if (d < 240) {
          const force = (1 - d / 240) * 5;
          p.vx += dx / d * force;
          p.vy += dy / d * force;
        }
      }
    }

    function draw(time) {
      requestAnimationFrame(draw);
      if (paused) return;

      ctx.fillStyle = 'rgba(7, 11, 20, .16)';
      ctx.fillRect(0, 0, width, height);
      ctx.globalCompositeOperation = 'lighter';

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.phase += .008;
        p.vx += Math.cos(p.phase + p.y * .003) * .002;
        p.vy += Math.sin(p.phase + p.x * .003) * .002;

        if (pointer.active) {
          const dx = pointer.x - p.x;
          const dy = pointer.y - p.y;
          const d2 = dx * dx + dy * dy + 100;
          if (d2 < 70000) {
            p.vx += dx / d2 * .5;
            p.vy += dy / d2 * .5;
          }
        }

        p.vx *= .995;
        p.vy *= .995;
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < -20) p.x = width + 20;
        if (p.x > width + 20) p.x = -20;
        if (p.y < -20) p.y = height + 20;
        if (p.y > height + 20) p.y = -20;

        const pulse = .75 + Math.sin(time * .0015 + p.phase) * .25;
        const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 8);
        glow.addColorStop(0, `hsla(${p.hue}, 90%, 76%, ${pulse})`);
        glow.addColorStop(.2, `hsla(${p.hue}, 85%, 60%, ${pulse * .4})`);
        glow.addColorStop(1, `hsla(${p.hue}, 80%, 40%, 0)`);
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 8, 0, Math.PI * 2);
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const q = particles[j];
          const dx = q.x - p.x;
          const dy = q.y - p.y;
          const distance = Math.hypot(dx, dy);
          if (distance < 90) {
            ctx.strokeStyle = `hsla(${(p.hue + q.hue) / 2}, 70%, 65%, ${(1 - distance / 90) * .1})`;
            ctx.lineWidth = .5;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.stroke();
          }
        }
      }

      ctx.globalCompositeOperation = 'source-over';
    }

    addEventListener('resize', resize);
    addEventListener('pointermove', event => {
      pointer.x = event.clientX;
      pointer.y = event.clientY;
      pointer.active = true;
      overlay.classList.add('hidden');
    });
    addEventListener('pointerleave', () => pointer.active = false);
    addEventListener('pointerdown', event => disturb(event.clientX, event.clientY));
    addEventListener('keydown', event => {
      if (event.code === 'Space') {
        event.preventDefault();
        paused = !paused;
        if (!paused) ctx.clearRect(0, 0, width, height);
      }
    });

    resize();
    ctx.fillStyle = '#070b14';
    ctx.fillRect(0, 0, width, height);
    requestAnimationFrame(draw);
    setTimeout(() => overlay.classList.add('hidden'), 5000);
  </script>
</body>
</html>
