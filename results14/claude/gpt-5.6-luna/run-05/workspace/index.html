<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Good Thing</title>
  <style>
    :root { color-scheme: light; --ink:#24312d; --muted:#6d7d75; --leaf:#2f7d5b; --cream:#fbfaf5; --line:#dfe8df; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); background:linear-gradient(135deg,#edf6ec,#fbfaf5 55%,#f4ecdf); font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(680px,100%); padding:clamp(28px,7vw,64px); border:1px solid rgba(255,255,255,.8); border-radius:28px; background:rgba(255,255,255,.72); box-shadow:0 24px 80px rgba(49,83,62,.13); backdrop-filter:blur(12px); }
    .eyebrow { margin:0 0 18px; color:var(--leaf); font-size:.78rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { max-width:12ch; margin:0; font:600 clamp(2.6rem,8vw,5rem)/.98 Georgia,serif; letter-spacing:-.05em; }
    .intro { max-width:46ch; margin:24px 0 34px; color:var(--muted); font-size:1.08rem; }
    .prompt { min-height:130px; display:flex; align-items:center; padding:25px; border:1px solid var(--line); border-radius:18px; background:var(--cream); font:1.35rem/1.35 Georgia,serif; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:18px; }
    button { cursor:pointer; border:0; border-radius:999px; padding:12px 18px; color:white; background:var(--leaf); font:700 .95rem system-ui,sans-serif; transition:transform .15s,box-shadow .15s; }
    button:hover { transform:translateY(-2px); box-shadow:0 7px 16px rgba(47,125,91,.22); }
    button.secondary { color:var(--leaf); background:#e5f0e5; }
    .note { margin:25px 0 0; color:var(--muted); font-size:.82rem; }
    .note kbd { padding:2px 6px; border:1px solid #ccd8ce; border-radius:5px; background:white; font-family:inherit; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A tiny reset</p>
    <h1>Do one good thing.</h1>
    <p class="intro">When the day feels noisy, pick something small enough to begin before you feel ready.</p>
    <section class="prompt" id="prompt" aria-live="polite">Put your phone away for five minutes and notice what your attention returns to.</section>
    <div class="actions">
      <button id="another">Give me another</button>
      <button class="secondary" id="copy">Copy idea</button>
    </div>
    <p class="note">Tip: press <kbd>Space</kbd> for a new idea.</p>
  </main>
  <script>
    const ideas = [
      'Drink a glass of water slowly, without multitasking.',
      'Send one sincere thank-you message.',
      'Open a window and take ten unhurried breaths.',
      'Write down the one thing that would make today feel lighter.',
      'Tidy one surface until it feels calm to look at.',
      'Take a short walk and leave your headphones at home.',
      'Make tomorrow easier by preparing one small thing now.',
      'Look for something beautiful and stay with it for a full minute.',
      'Read one page of a book you already love.',
      'Do the smallest version of the task you have been avoiding.'
    ];
    const prompt = document.querySelector('#prompt');
    const another = document.querySelector('#another');
    const copy = document.querySelector('#copy');
    function showIdea() {
      let next = ideas[Math.floor(Math.random() * ideas.length)];
      while (ideas.length > 1 && next === prompt.textContent) next = ideas[Math.floor(Math.random() * ideas.length)];
      prompt.textContent = next;
    }
    another.addEventListener('click', showIdea);
    copy.addEventListener('click', async () => {
      await navigator.clipboard.writeText(prompt.textContent);
      copy.textContent = 'Copied';
      setTimeout(() => copy.textContent = 'Copy idea', 1200);
    });
    document.addEventListener('keydown', event => {
      if (event.code === 'Space' && event.target.tagName !== 'BUTTON') { event.preventDefault(); showIdea(); }
    });
  </script>
</body>
</html>
