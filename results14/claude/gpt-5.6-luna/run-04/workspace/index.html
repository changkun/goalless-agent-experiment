<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Good Thing</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #24333b;
      --muted: #66777d;
      --paper: #fffdf8;
      --mint: #dceee5;
      --coral: #e7836b;
      --shadow: 0 20px 60px #25433b1a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: var(--ink); font: 16px/1.5 system-ui, sans-serif;
      background: linear-gradient(135deg, #d8eee7, #f9e6d2);
    }
    main {
      width: min(100%, 620px); padding: clamp(28px, 7vw, 64px);
      background: var(--paper); border-radius: 28px; box-shadow: var(--shadow);
    }
    .eyebrow { margin: 0 0 12px; color: var(--coral); font-size: .78rem;
      font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font: 700 clamp(2.4rem, 8vw, 4.5rem)/.95 Georgia, serif;
      letter-spacing: -.05em; }
    .prompt { margin: 24px 0 20px; color: var(--muted); font-size: 1.1rem; }
    textarea { width: 100%; min-height: 130px; resize: vertical; padding: 16px;
      border: 2px solid var(--mint); border-radius: 14px; color: var(--ink);
      background: #ffffff; font: inherit; }
    textarea:focus { outline: 3px solid #e7836b55; border-color: var(--coral); }
    button { margin-top: 14px; padding: 12px 18px; border: 0; border-radius: 999px;
      color: white; background: var(--ink); cursor: pointer; font-weight: 700; }
    button:hover { background: var(--coral); }
    .saved { min-height: 1.5em; margin: 22px 0 0; color: var(--muted); }
    .saved strong { color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A tiny pause</p>
    <h1>One good thing.</h1>
    <p class="prompt">It does not have to be important. What was one small thing that made today a little better?</p>
    <label for="thought" class="sr-only">Your one good thing</label>
    <textarea id="thought" placeholder="A warm drink. A message. The light on the wall."></textarea>
    <button id="save">Keep this thought</button>
    <p class="saved" id="saved" aria-live="polite"></p>
  </main>
  <script>
    const thought = document.querySelector('#thought');
    const saved = document.querySelector('#saved');
    const button = document.querySelector('#save');
    const previous = localStorage.getItem('one-good-thing');
    if (previous) saved.innerHTML = `Last time, you noticed: <strong>${escapeHtml(previous)}</strong>`;
    button.addEventListener('click', () => {
      const value = thought.value.trim();
      if (!value) { thought.focus(); return; }
      localStorage.setItem('one-good-thing', value);
      saved.innerHTML = 'Kept. You can let the rest of the day be unfinished.';
      thought.value = '';
    });
    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
    }
  </script>
</body>
</html>
